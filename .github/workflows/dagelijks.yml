name: Dagelijkse verversing

# Haalt elke ochtend de berichten op en zet de app op GitHub Pages.
# Gemeenten publiceren op werkdagen rond 09:00 uur; tijden hieronder zijn in UTC.
on:
  schedule:
    - cron: "40 7 * * 1-5"   # 09:40 zomertijd (08:40 wintertijd)
    - cron: "40 8 * * 1-5"   # 09:40 wintertijd (10:40 zomertijd)
    - cron: "10 11 * * *"    # vangnet rond het middaguur, ook in het weekend
    - cron: "10 15 * * 1-5"  # tweede vangnet voor publicaties die later op de dag verschijnen
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover tests
      - name: Gebied bijwerken (gemeenten en plaatsen binnen de straal)
        run: python -m signalen.gebied || echo "::warning::Gebied niet bijgewerkt; bestaande lijst wordt gebruikt"
      - name: Berichten ophalen
        run: python -m signalen.update
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
