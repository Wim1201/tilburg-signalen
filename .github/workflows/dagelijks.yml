name: Dagelijkse verversing

# Haalt de berichten op en zet de app op GitHub Pages.
# De bron publiceert het Gemeenteblad op werkdagen tussen 09:00 en 09:21 uur (gemeten op 12, 13 en
# 16-11-2026). De tijden hieronder zijn Nederlandse tijd (timezone Europe/Amsterdam), zomer en winter
# gelijk. Zonder timezone rekent GitHub in UTC. GitHub kan een geplande run later starten of bij
# drukte overslaan; daarom staan er meer runs dan strikt nodig. Een run met cache kost ongeveer
# 35 verzoeken en anderhalve minuut.
on:
  schedule:
    - cron: "45 6 * * 1-5"    # 06:45 uur: alles tot en met gisteren staat klaar bij het opstaan
      timezone: "Europe/Amsterdam"
    - cron: "35 9 * * 1-5"    # 09:35 uur: de publicaties van vandaag
      timezone: "Europe/Amsterdam"
    - cron: "20 10 * * 1-5"   # 10:20 uur: vangnet voor de ochtend; vanaf 10 uur telt ook de dagcontrole
      timezone: "Europe/Amsterdam"
    - cron: "10 12 * * *"     # 12:10 uur: vangnet, ook in het weekend
      timezone: "Europe/Amsterdam"
    - cron: "10 16 * * 1-5"   # 16:10 uur: publicaties die later op de dag verschijnen
      timezone: "Europe/Amsterdam"
    - cron: "30 4 * * 0"      # zondag 04:30 uur: wekelijkse volledige verversing, cache negeren
      timezone: "Europe/Amsterdam"
  push:
    branches: [main]
    # Een push die alleen docs/ raakt (verslagen) verandert de app en de gegevens niet en start geen run.
    # Raakt een push ook iets buiten docs/, dan start de run gewoon. Geplande en handmatige runs staan hier los van.
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
    inputs:
      volledig:
        description: "Volledige verversing: de kern en de regio van de week opnieuw lezen, de rest uit de cache"
        type: boolean
        default: false
      gepland:
        # Voor de planner (tools/planner), die de run op de tijden van het schema start als GitHub
        # dat zelf niet doet. Met de hand laat je dit uit.
        description: "Gestart door de planner: gedraagt zich als een geplande run, zonder browsertests vooraf"
        type: boolean
        default: false

permissions:
  contents: write   # nodig om de cache terug te zetten in het repository
  pages: write
  id-token: write

# Eén run tegelijk. Geplande, handmatige en door een merge gestarte runs wachten op elkaar in plaats
# van elkaar te kruisen, zodat elke run de cache leest die de vorige heeft teruggezet. Een lopende
# run wordt nooit afgebroken. Let op: GitHub houdt per groep één wachtende run vast; komt er nog een
# bij, dan vervalt de oudste wachtende.
concurrency:
  group: dagelijkse-verversing
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # De actuele stand van de branch, niet de commit van het moment waarop de run werd aangevraagd:
          # een run die heeft staan wachten, krijgt zo de cache van de run ervoor.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover tests
      # De pagina in een echte browser. Alleen bij een push en bij een handmatige run: de pagina
      # verandert alleen door een push, en een hapering van de browser mag een geplande verversing niet
      # tegenhouden. Dat geldt ook voor een run die de planner start (invoer `gepland`).
      # Vóór het ophalen: de droogloop rekent op de gegevens zoals ze in de repository staan.
      - name: Browser klaarzetten
        if: github.event_name != 'schedule' && !inputs.gepland
        timeout-minutes: 10
        uses: ./.github/actions/browser
      - name: Browsertests
        if: github.event_name != 'schedule' && !inputs.gepland
        timeout-minutes: 10
        run: |
          # Zonder Playwright slaan deze tests zichzelf over en zou de stap groen zijn zonder iets te testen.
          node -e "require('playwright')"
          python -m unittest tests.test_site.InDeBrowser tests.test_video.Droogloop
      - name: Gebied bijwerken (gemeenten en plaatsen binnen de straal)
        run: python -m signalen.gebied || echo "::warning::Gebied niet bijgewerkt; bestaande lijst wordt gebruikt"
      - name: Berichten ophalen
        # Gewone run: alleen nieuwe publicaties ophalen, de rest komt uit cache/ophaalcache.json.
        # Wekelijks en op verzoek: de kern en één regio opnieuw (bij toerbeurt per week), zodat wijzigingen en
        # intrekkingen binnenkomen. De andere regio's komen die week uit de cache.
        run: |
          # De wekelijkse run is de enige geplande run op zondag vóór 9 uur (de andere is 12:10 uur).
          # Op de klok herkend en niet op de cron-regel, zodat een wijziging van het schema dit niet breekt.
          dag_uur="$(TZ=Europe/Amsterdam date +%u-%H)"
          wekelijks=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${dag_uur%-*}" = "7" ] && [ "${dag_uur#*-}" -lt 9 ]; then
            wekelijks=true
          fi
          if [ "$wekelijks" = "true" ] || [ "${{ inputs.volledig }}" = "true" ]; then
            python -m signalen.update --volledig
          else
            python -m signalen.update
          fi
      - name: Cache bewaren in het repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/ophaalcache.json
          if git diff --cached --quiet; then
            echo "Cache ongewijzigd"
          else
            git commit -m "Cache bijgewerkt [skip ci]"
            git push origin HEAD:main || echo "::warning::Cache niet opgeslagen; de volgende run haalt het ontbrekende opnieuw op"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publiceren:
    needs: bouwen
    # Alleen vanaf main. Een handmatige run vanaf een andere branch test en bouwt, maar zet niets live.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # De pagina van de live site in een echte browser, met de gegevens die net zijn gepubliceerd. Draait
  # na elk publiceren, ook bij de geplande runs, en houdt het publiceren niet tegen: de site staat dan
  # al live. Faalt deze job, dan toont Actions een rood kruis bij de run. Is er niet gepubliceerd
  # (mislukt, of een run vanaf een andere branch), dan wordt deze job overgeslagen.
  live-controleren:
    needs: publiceren
    runs-on: ubuntu-latest
    # Eén run tegelijk: een hangende controle mag de volgende verversing niet uren ophouden.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Dezelfde stand als bouwen: de test vergelijkt de live site met de huisstijl in de repository.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser klaarzetten
        uses: ./.github/actions/browser
      - name: Paginatest tegen de live site
        env:
          TILBURG_SITE_URL: https://wim1201.github.io/tilburg-signalen
        run: |
          # Zonder Playwright slaan deze tests zichzelf over en zou de stap groen zijn zonder iets te testen.
          node -e "require('playwright')"
          python -m unittest tests.test_site.InDeBrowser
