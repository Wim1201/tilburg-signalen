<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Tilburg Signalen: opname</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* The stage of the screen recording: 1920 x 1080 in the house style. Left the name of the scene and
   what is being said, right the app in a phone. The recorder (opname.js) moves the pointer. */
:root { --navy: #0c1049; --deep: #070920; --paper: #f6f2e9; --signal: #ff5a2b; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); color: var(--paper); font-family: "Instrument Sans", system-ui, sans-serif; }
.col { position: absolute; left: 130px; top: 0; width: 900px; height: 1080px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 22px; margin-top: 96px; }
.brand svg { width: 84px; height: 84px; color: var(--paper); }
.brand .sig { fill: var(--signal); }
.brand b { font: 800 44px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.01em; }
.brand b span { color: var(--signal); }
.scene { margin-top: 150px; }
.step { font: 500 22px/1 "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--signal); }
h1 { margin: 18px 0 30px; font: 800 96px/1.02 "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; }
.say { max-width: 820px; font-size: 33px; line-height: 1.42; color: rgb(246 242 233 / .9); text-wrap: pretty; min-height: 330px; }
.dots { position: absolute; left: 0; bottom: 96px; display: flex; gap: 12px; }
.dots i { display: block; width: 64px; height: 6px; border-radius: 3px; background: rgb(246 242 233 / .22); }
.dots i.on { background: var(--signal); }
.phone { position: absolute; left: 1250px; top: 30px; width: 484px; height: 1020px; border-radius: 58px; background: var(--deep); box-shadow: 0 0 0 2px rgb(246 242 233 / .18), 0 40px 90px rgb(0 0 0 / .45); }
.screen { position: absolute; left: 12px; top: 12px; width: 460px; height: 996px; border-radius: 46px; overflow: hidden; background: var(--paper); }
iframe { width: 390px; height: 844px; border: 0; transform: scale(1.1795); transform-origin: 0 0; display: block; }
#pointer { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; pointer-events: none; z-index: 5;
  background: rgb(255 90 43 / .22); border: 3px solid var(--signal); box-shadow: 0 0 0 2px rgb(255 255 255 / .75), 0 6px 18px rgb(0 0 0 / .28); will-change: transform; }
#ripple { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; pointer-events: none; z-index: 4; border: 3px solid var(--signal); opacity: 0; }
#veil { position: absolute; inset: 0; background: var(--navy); z-index: 8; opacity: 1; pointer-events: none; }
#end { position: absolute; inset: 0; z-index: 9; background: var(--navy); opacity: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; text-align: center; }
#end svg { width: 220px; height: 220px; color: var(--paper); }
#end b { font: 800 104px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; }
#end b span { color: var(--signal); }
#end p { margin: 0; font-size: 38px; color: rgb(246 242 233 / .85); }
</style>
</head>
<body>
<div class="col">
  <div class="brand"><!--MARK--><b>Tilburg <span>Signalen</span></b></div>
  <div class="scene">
    <div class="step" id="step"></div>
    <h1 id="kop"></h1>
    <p class="say" id="say"></p>
  </div>
  <div class="dots" id="dots"></div>
</div>
<div class="phone"><div class="screen"><iframe id="app" title="De app"></iframe></div></div>
<div id="ripple"></div>
<div id="pointer"></div>
<div id="veil"></div>
<div id="end"><!--MARK--><b>Tilburg <span>Signalen</span></b><p>Ontwikkellocaties rond Tilburg, op een rij.</p></div>
</body>
</html>
